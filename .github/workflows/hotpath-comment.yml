name: hotpath-comment

on:
  workflow_run:
    workflows: ["hotpath-profile"]
    types:
      - completed

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/download-artifact@v4
        with:
          name: profile-metrics
          path: /tmp/metrics/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Read PR metadata
        id: metadata
        run: |
          pr_number=$(cat /tmp/metrics/pr_number.txt)
          has_hotpath=$(cat /tmp/metrics/has_hotpath.txt)
          echo "pr_number=$pr_number" >> $GITHUB_OUTPUT
          echo "has_hotpath=$has_hotpath" >> $GITHUB_OUTPUT

      - name: Post comment (base missing hotpath)
        if: ${{ steps.metadata.outputs.has_hotpath != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number="${{ steps.metadata.outputs.pr_number }}"
          gh pr comment "$pr_number" --body "## 🔥 Hotpath Benchmark

✅ Head benchmark completed successfully.

⚠️ Base branch doesn't have hotpath feature yet - no comparison available.

The hotpath profiling is now active for future PRs."

      - name: Install hotpath-utils CLI
        if: ${{ steps.metadata.outputs.has_hotpath == 'true' }}
        run: cargo install hotpath --features=utils --bin hotpath-utils

      - name: Post PR comment with comparison
        if: ${{ steps.metadata.outputs.has_hotpath == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr_number="${{ steps.metadata.outputs.pr_number }}"
          export GITHUB_BASE_REF=$(cat /tmp/metrics/base_ref.txt)
          export GITHUB_HEAD_REF=$(cat /tmp/metrics/head_ref.txt)
          hotpath-utils profile-pr \
            --head-metrics /tmp/metrics/head_timing.json \
            --base-metrics /tmp/metrics/base_timing.json \
            --github-token "$GH_TOKEN" \
            --pr-number "$pr_number" \
            --benchmark-id "timing"
